[package]
name = "mineru-service"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-multipart = "0.7"
actix-files = "0.6"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
zip = "2"
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
futures-util = "0.3"
