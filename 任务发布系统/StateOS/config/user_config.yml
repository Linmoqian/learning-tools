# StateOS 用户自定义配置
# 修改以下值以个性化您的系统，然后重启程序

# ==================== 可选日程安排 ====================
# 在晨间评估中使用这些课程选项
course_options:
  - 无安排
  - 高数课
  - 线代课
  - 英语课
  - 政治课
  - 算法学习
  - 可自习的水课
  - 体育课
  - 健身运动
  - 休闲阅读
  - 外出办事
  - 家庭时间
  - 其他课程  # 您可以添加自己的课程

# ==================== 每小时水分消耗 ====================
# 根据活动类型设置每小时水分消耗百分比
hourly_thirst_consumption:
  高数课: 12
  线代课: 10
  英语课: 8
  政治课: 8
  默认值: 8

# ==================== 待办事项精力消耗系数 ====================
# 数值越大表示消耗精力越多
task_energy_coefficient:
  英语四级单词: 1.5
  数学作业: 2.0
  编程任务: 2.5
  论文写作: 3.0
  数据分析: 2.8
  简单阅读: 0.8
  邮件处理: 1.0
  会议准备: 1.8
  代码调试: 2.2
  创意写作: 2.4

# ==================== 状态阈值提醒 ====================
# 当状态值低于这些阈值时发出提醒
threshold_alerts:
  energy:
    low: 30
    critical: 15
    warning_message: "精力值过低，建议休息"
    critical_message: "精力值严重不足，请立即休息！"
  thirst:
    low: 40
    critical: 20
    warning_message: "口渴值过低，建议补水"
    critical_message: "严重缺水，请立即补水！"
  hunger:
    low: 30
    critical: 15
    warning_message: "饥饿值过低，建议进食"
    critical_message: "严重饥饿，请立即进食！"

# ==================== 自定义活动规则 ====================
# 添加您自己的活动规则
custom_activities:
  冥想:
    name: "冥想"
    icon: "🧘"
    description: "15分钟冥想，恢复精力"
    effects:
      energy: 20      # 注意：不是 energy_change
      thirst: -5      # 注意：不是 thirst_change
      hunger: 0       # 注意：不是 hunger_change
    duration: 15

  代码时间:
    name: "代码时间"
    icon: "💻"
    description: "专注编程45分钟"
    effects:
      energy: -15
      thirst: -10
      hunger: -8
    duration: 45

  散步:
    name: "散步"
    icon: "🚶"
    description: "30分钟户外散步"
    effects:
      energy: 10
      thirst: -12
      hunger: -5
    duration: 30

  深度阅读:
    name: "深度阅读"
    icon: "📚"
    description: "60分钟深度阅读"
    effects:
      energy: -20
      thirst: -8
      hunger: -10
    duration: 60

# ==================== 系统推荐规则 ====================
# 当达成某种状态组合时，系统给出的建议
system_recommendations:
  - condition: "energy < 30 and thirst > 80"
    recommendation: "建议先补水，然后短暂休息"
  - condition: "energy > 80 and hunger < 30"
    recommendation: "高能状态，适合进行深度工作"
  - condition: "energy < 20 and hunger < 20"
    recommendation: "需要补充能量和食物，建议暂停工作"
  - condition: "thirst < 20"
    recommendation: "严重缺水，请立即补水"
  - condition: "energy > 70 and thirst > 60 and hunger > 50"
    recommendation: "状态良好，适合进行重要任务"

# ==================== 界面自定义 ====================
ui_customization:
  theme: "light"  # 可选: light（亮色）, dark（暗色）
  font_size: 10
  language: "zh_CN"  # 中文
  show_tray_icon: true
  minimize_to_tray: true
  auto_startup: false

# ==================== 通知设置 ====================
notifications:
  enable_reminders: true
  reminder_interval_minutes: 60
  show_notifications: true
  sound_notification: false
  popup_duration_seconds: 5

# ==================== 数据设置 ====================
data_settings:
  auto_backup: true
  backup_count: 10
  export_format: "json"  # json, csv
  privacy_mode: false
